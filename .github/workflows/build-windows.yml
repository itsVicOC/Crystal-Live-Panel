name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:udp
      - run: npm run package:win:all
      - name: Audit packaged application
        run: node scripts/audit-package.mjs
      - name: Generate SHA-256 checksums
        run: node scripts/release-checksums.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: crystal-live-panel-windows-x64
          path: |
            release/Crystal-Live-Panel-*-x64.exe
            release/Crystal-Live-Panel-*-x64.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            release/Crystal-Live-Panel-*-x64.exe
            release/Crystal-Live-Panel-*-x64.zip
            release/SHA256SUMS.txt
